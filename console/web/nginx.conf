server {
    listen 5173;
    server_name localhost;

    # ── Security Headers / 安全响应头 ────────────────────────────────
    # P13 fix: prevent clickjacking, MIME sniffing, XSS, referrer leakage
    # P65 fix: add Content-Security-Policy (CSP) to mitigate XSS/data-injection attacks
    # P71 note: these headers are at server-block level; nginx inherits them
    #   into all location blocks that do not define their own add_header.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://localhost:* ws://localhost:*; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Client body size limit / 请求体大小限制 ──────────────────────
    # P14 fix: default 1m is too small for file upload scenarios
    client_max_body_size 50m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Static asset caching / 静态资源缓存
        # Vite 构建产物带 content hash，可安全强缓存
        # P71 fix: use `expires` directive instead of `add_header Cache-Control`
        #   because `add_header` in a nested location breaks server-block security
        #   header inheritance (nginx override semantics).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
        }
    }

    # 反向代理 Go BFF 网关后端
    location /v1/ {
        proxy_pass http://console-backend-go:8081/v1/;
        # P75 fix: use HTTP/1.1 for upstream connections to enable keepalive
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # P14 fix: proxy timeouts / 代理超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 反向代理 Go 后端兼容别名
    location /v1/go/ {
        proxy_pass http://console-backend-go:8081/;
        # P75 fix: use HTTP/1.1 for upstream connections to enable keepalive
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # P14 fix: proxy timeouts / 代理超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 反向代理 数据服务调度中枢 (Service Hub)
    location /v1/hub/ {
        proxy_pass http://service-hub:8082/v1/hub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 反向代理 数据源管理 (Datasource Manager)
    location /v1/datasources {
        proxy_pass http://datasource-mgr:8083/v1/datasources;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 反向代理 BFF 自身健康检查（无前缀端点）
    location = /health {
        proxy_pass http://console-backend-go:8081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 反向代理 脱敏审计日志 (Audit Log)
    location /v1/audit/ {
        proxy_pass http://audit-log:8084/v1/audit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Deny access to hidden files / 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}
