# PrivShield - Prometheus Alert Rules
# 隐私本地代理 - Prometheus 告警规则
#
# 使用方法 / Usage:
#   将此文件挂载到 Prometheus 的 rules 目录，并在 prometheus.yml 中引用：
#   Mount this file to Prometheus rules directory and reference in prometheus.yml:
#
#   rule_files:
#     - /etc/prometheus/rules/PrivShield-alerts.yml

groups:
  - name: PrivShield.availability
    rules:
      # 网关无健康后端节点 / Gateway has no healthy backend nodes
      - alert: GatewayNoHealthyNodes
        expr: privacy_gateway_healthy_nodes == 0
        for: 1m
        labels:
          severity: critical
          service: PrivShield
        annotations:
          summary: "Gateway has no healthy backend nodes"
          description: "The PrivShield gateway has 0 healthy backend nodes for more than 1 minute. All requests will fail."
          runbook_url: "https://github.com/fengzhizi319/PrivShield-go/docs/gateway_balancer/ops.md"

      # 网关健康节点数低于预期 / Gateway healthy nodes below expected
      - alert: GatewayDegradedCapacity
        expr: privacy_gateway_healthy_nodes < 2
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "Gateway running with degraded capacity"
          description: "The PrivShield gateway has fewer than 2 healthy backend nodes for more than 5 minutes."

  - name: PrivShield.latency
    rules:
      # REST 请求 P95 延迟过高 / REST request P95 latency too high
      - alert: HighRequestLatencyP95
        expr: histogram_quantile(0.95, sum(rate(privacy_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "High request latency (P95 > 1s)"
          description: "The P95 request latency for PrivShield is above 1 second for more than 5 minutes."

      # 网关代理延迟过高 / Gateway proxy latency too high
      - alert: HighGatewayLatencyP95
        expr: histogram_quantile(0.95, sum(rate(privacy_gateway_latency_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "High gateway proxy latency (P95 > 2s)"
          description: "The P95 gateway proxy latency is above 2 seconds for more than 5 minutes."

      # 分类操作延迟过高 / Classification operation latency too high
      - alert: HighClassificationLatency
        expr: histogram_quantile(0.95, sum(rate(privacy_classification_duration_seconds_bucket[5m])) by (le, operation)) > 5
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "High classification latency (P95 > 5s)"
          description: "The P95 classification operation latency is above 5 seconds for more than 5 minutes."

  - name: PrivShield.errors
    rules:
      # 网关 5xx 错误率过高 / Gateway 5xx error rate too high
      - alert: HighGatewayErrorRate
        expr: |
          sum(rate(privacy_gateway_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(privacy_gateway_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
          service: PrivShield
        annotations:
          summary: "High gateway 5xx error rate (> 5%)"
          description: "The gateway 5xx error rate is above 5% for more than 5 minutes."

      # 认证拒绝率过高 / Authentication denial rate too high
      - alert: HighAuthDenialRate
        expr: |
          sum(rate(privacy_auth_denials_total[5m]))
          /
          sum(rate(privacy_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "High authentication denial rate (> 10%)"
          description: "The authentication denial rate is above 10% for more than 5 minutes. This may indicate an attack or misconfigured clients."

      # 网关重试率过高 / Gateway retry rate too high
      - alert: HighGatewayRetryRate
        expr: |
          sum(rate(privacy_gateway_retries_total[5m]))
          /
          sum(rate(privacy_gateway_requests_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "High gateway retry rate (> 10%)"
          description: "The gateway retry rate is above 10% for more than 5 minutes. Backend nodes may be unhealthy."

  - name: PrivShield.privacy
    rules:
      # 隐私预算即将耗尽 / Privacy budget nearly exhausted
      - alert: PrivacyBudgetNearlyExhausted
        expr: privacy_budget_remaining < 0.1
        for: 1m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "Privacy budget nearly exhausted"
          description: "The privacy budget for namespace {{ $labels.namespace }} ({{ $labels.budget_type }}) is below 0.1. Consider resetting or increasing the budget."

      # 隐私预算已耗尽 / Privacy budget exhausted
      - alert: PrivacyBudgetExhausted
        expr: privacy_budget_remaining <= 0
        for: 1m
        labels:
          severity: critical
          service: PrivShield
        annotations:
          summary: "Privacy budget exhausted"
          description: "The privacy budget for namespace {{ $labels.namespace }} ({{ $labels.budget_type }}) is exhausted. All DP queries will be rejected."

  - name: PrivShield.classification
    rules:
      # LLM 分类器错误率过高 / LLM classifier error rate too high
      - alert: HighLLMClassifierErrorRate
        expr: |
          sum(rate(privacy_classification_llm_total{status="error"}[5m]))
          /
          sum(rate(privacy_classification_llm_total[5m]))
          > 0.1
        for: 5m
        labels:
          severity: warning
          service: PrivShield
        annotations:
          summary: "High LLM classifier error rate (> 10%)"
          description: "The LLM classifier error rate is above 10% for more than 5 minutes."

  - name: PrivShield.services
    rules:
      # 调度中枢 P95 延迟过高 / Service Hub scheduling latency high
      - alert: ServiceHubHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{module="service-hub"}[5m])) by (le, path)) > 2
        for: 3m
        labels:
          severity: warning
          service: service-hub
        annotations:
          summary: "Service Hub high request latency (P95 > 2s)"
          description: "Pipeline orchestration P95 latency is above 2 seconds for path {{ $labels.path }}."

      # 调度中枢 5xx 错误率过高 / Service Hub 5xx error rate high
      - alert: ServiceHubHighErrorRate
        expr: |
          sum(rate(http_requests_total{module="service-hub",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{module="service-hub"}[5m]))
          > 0.05
        for: 3m
        labels:
          severity: critical
          service: service-hub
        annotations:
          summary: "Service Hub 5xx error rate (> 5%)"
          description: "Service Hub error rate exceeds 5% for more than 3 minutes."

      # 上游 Agent 算力调用失败率过高 / Upstream Agent call failure rate high
      - alert: ServiceHubAgentCallFailure
        expr: |
          sum(rate(agent_requests_total{module="service-hub",status=~"5.."}[5m]))
          /
          sum(rate(agent_requests_total{module="service-hub"}[5m]))
          > 0.05
        for: 3m
        labels:
          severity: critical
          service: service-hub
        annotations:
          summary: "Service Hub upstream Agent call failure rate (> 5%)"
          description: "Upstream Agent privacy computation calls failed for endpoint {{ $labels.endpoint }}."

      # 审计日志写入异常 / Audit Log write error rate high
      - alert: AuditLogWriteFailure
        expr: |
          sum(rate(http_requests_total{module="audit-log",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{module="audit-log"}[5m]))
          > 0.05
        for: 3m
        labels:
          severity: critical
          service: audit-log
        annotations:
          summary: "Audit Log service write failure rate (> 5%)"
          description: "Audit Log write or query error rate exceeds 5%."

  # ==============================================================================
  # 三级等保 G-09：安全事件集中管理与告警
  # ==============================================================================
  - name: PrivShield.security
    rules:
      # 暴力破解检测：单 IP 认证失败率突增 / Brute force: single IP auth failure spike
      - alert: BruteForceDetected
        expr: |
          sum by (client_ip) (rate(privacy_auth_failures_total[5m])) > 0.5
        for: 2m
        labels:
          severity: critical
          service: PrivShield
          attack_type: brute_force
        annotations:
          summary: "Brute force attack detected from {{ $labels.client_ip }}"
          description: "Client IP {{ $labels.client_ip }} has authentication failure rate > 0.5/s for 2 minutes."

      # 账号锁定事件激增 / Account lockout surge
      - alert: AccountLockoutSurge
        expr: |
          sum(rate(privacy_auth_account_lockouts_total[5m])) > 3
        for: 5m
        labels:
          severity: critical
          service: PrivShield
          attack_type: credential_attack
        annotations:
          summary: "Multiple account lockouts detected"
          description: "More than 3 account lockouts per second. Possible coordinated credential attack."

      # 越权访问尝试 / Privilege escalation attempts
      - alert: PrivilegeEscalationAttempt
        expr: |
          sum(rate(privacy_auth_forbidden_total[5m])) > 0.2
        for: 3m
        labels:
          severity: warning
          service: PrivShield
          attack_type: privilege_escalation
        annotations:
          summary: "Privilege escalation attempts detected"
          description: "Elevated rate of 403 Forbidden responses. Possible privilege escalation attempts."

      # WAF 攻击拦截率异常 / WAF block rate anomaly
      - alert: WAFHighBlockRate
        expr: |
          sum(rate(privacy_waf_blocks_total[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: PrivShield
          attack_type: web_attack
        annotations:
          summary: "High WAF block rate"
          description: "WAF is blocking > 1 request/s. Possible active web attack (SQLi/XSS/command injection)."

      # JWT 令牌吊销事件 / JWT token revocation events
      - alert: JWTRevocationSpike
        expr: |
          sum(rate(privacy_jwt_revocations_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: PrivShield
          attack_type: session_anomaly
        annotations:
          summary: "Unusual JWT token revocation rate"
          description: "High rate of JWT token revocations. Possible session hijacking or mass logout event."

      # 异常流量模式：单 IP 请求量过高 / Abnormal traffic: single IP request volume
      - alert: AbnormalTrafficVolume
        expr: |
          sum by (client_ip) (rate(privacy_requests_total[5m])) > 100
        for: 3m
        labels:
          severity: warning
          service: PrivShield
          attack_type: dos
        annotations:
          summary: "Abnormal traffic volume from {{ $labels.client_ip }}"
          description: "Single IP sending > 100 req/s for 3 minutes. Possible DoS or abuse."

      # 密码操作审计：加密/解密操作异常频率 / Crypto operation audit: abnormal frequency
      - alert: CryptoOperationAnomaly
        expr: |
          sum(rate(privacy_crypto_operations_total[5m])) > 500
        for: 5m
        labels:
          severity: warning
          service: PrivShield
          attack_type: crypto_abuse
        annotations:
          summary: "Abnormal crypto operation frequency"
          description: "Crypto operations (SM4 encrypt/decrypt, SM3 hash) exceed 500/s. Possible data exfiltration attempt."

