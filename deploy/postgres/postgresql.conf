# =============================================================================
# PrivShield 数盾 —— 合规级 PostgreSQL 参数基线（P2-12）
# Compliance-grade PostgreSQL tuning baseline for the evidence store.
# =============================================================================
# 挂载方式（见 deploy/docker-compose/docker-compose.prod.yml → phase-b-postgres）：
#   command: ["postgres","-D","/var/lib/postgresql/data/pgdata",
#             "-c","config_file=/etc/postgresql/postgresql.conf"]
#   volumes: - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
#
# ⚠️ 两个必须知道的副作用：
#   1) 指定 config_file 后，镜像 initdb 生成并被 entrypoint 追加过
#      `listen_addresses = '*'` 的 $PGDATA/postgresql.conf **不再被读取**，
#      因此本文件必须自己写出 listen_addresses / port / unix_socket_directories，
#      否则容器内的微服务将无法连接（表现为「服务启动即超时」而非报错）。
#   2) pg_hba.conf / pg_ident.conf 仍取自 PGDATA（entrypoint 会追加
#      `host all all all scram-sha-256`），本文件不覆盖 hba_file；网络边界由
#      compose 的 internal 网络 + 宿主机 127.0.0.1 发布端口共同收敛。
#
# 适用版本：postgres:16-alpine。改动后需重启进程（postmaster 级参数不可 reload）。
# 依据条目：docs/architecture/liuzhou_govcloud_data_security_architecture.md §12.1.3 P2-12。

# -----------------------------------------------------------------------------
# 1. 网络与监听（Network & listen）
# -----------------------------------------------------------------------------
listen_addresses = '*'                # 仅监听容器网桥；宿主机发布端口已固定 127.0.0.1:5432（P0-1 收敛入口）
port = 5432                           # 与 compose 中 SERVICE_HUB_PG_DSN / AUDIT_LOG_PG_DSN 的端口一致
unix_socket_directories = '/var/run/postgresql'   # pg_isready 健康检查走本地套接字，须保留
password_encryption = 'scram-sha-256' # 口令不得以 md5 落盘：等保三级身份鉴别 + 防离线破解

# -----------------------------------------------------------------------------
# 2. 传输加密（Transport encryption）—— 生产档位启用
# -----------------------------------------------------------------------------
# DSN 使用 sslmode=require（见 docker-compose.prod.yml），服务端必须 ssl=on，
# 否则 pgx 握手失败 → 服务在「存储不可用即中止」策略下直接退出（P0-4）。
# 证书按约定放 ./certs/postgres/tls.crt|tls.key，CA 为 ./certs/ca.crt（只读挂载到 /certs）。
# 非生产堆栈（docker-compose.yml / .dev / .test / .app-lz）在 command 里追加
# `-c ssl=off` 覆盖本段，因为镜像/仓库不提供测试证书。
# ⚠️ 诚实说明：PostgreSQL 16 不支持 GM/T 0024 TLCP 与 SM2 证书链，此处仅为
#    通用 TLS；若局方要求国密传输通道，须在其前方挂 TLCP 网关/国密负载均衡，
#    不得把本段配置宣称为「国密加密链路」。
ssl = on                                       # 传输加密（dev/test 用 -c ssl=off 覆盖）
ssl_cert_file = '/certs/postgres/tls.crt'
ssl_key_file = '/certs/postgres/tls.key'
ssl_ca_file = '/certs/ca.crt'                  # 仅作客户端证书校验信任链；是否强制校验由 pg_hba.conf 的 hostssl ... cert 行决定
ssl_min_protocol_version = 'TLSv1.2'           # 禁 TLS1.0/1.1（GB/T 22239 安全通信网络）
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL:!MD5:!RC4:!EXPORT'   # 剔除匿名/导出级套件
ssl_prefer_server_ciphers = on                 # 服务端决定套件，避免客户端降级到弱套件
# ⚠️ bind 挂载证书的所有权：PostgreSQL 要求私钥权限为 0600/0640 且属主=运行用户，
#    postgres:16-alpine 内为 uid 70，故宿主机需 `sudo chown 70:70 certs/postgres/tls.key`
#    （app 服务镜像内为 uid 1000/privacy，两者优先自查）。权限过宽时 postmaster 报
#    "private key file has group or world access" 并拒绝启动。

# -----------------------------------------------------------------------------
# 3. 崩溃一致性与存证持久性（Durability）—— 本文件的核心（P2-12）
# -----------------------------------------------------------------------------
# 存证链（prev_hash/integrity_hash）与 Hub 任务租约都以「已确认写入」为语义：
# synchronous_commit=on 表示事务返回成功即 WAL 已 fsync，进程或主机崩溃后不丢已确认记录。
# 关闭它换来的吞吐提升，代价是「已回给用户/已入链的存证可能消失」，属不可接受风险。
synchronous_commit = on                # 任何已确认存证不丢失（等保三级数据完整性、数安法二十一条）
full_page_writes = on                  # 防部分写（torn page）导致链上出现无法校验的损坏元组
wal_sync_method = fdatasync            # 容器/overlayfs 下的标准安全取值；不引入 O_DIRECT 兼容性风险
# （PG16 无 flush_after 参数，即不存在「攒批延迟 fsync」的开关；该参数自 PG17 起才有。）
wal_level = replica                    # 保留完整 WAL：支持 PITR/备库，使证据库可做异地副本
wal_compression = on                   # 仅压缩 WAL 体积（降低副本带宽），不改变任何一致性语义
data_sync_retry = off                  # 存储层写失败时中止而非带病运行：宁可停机，不可静默丢证
wal_log_hints = on                     # 配合 pg_rewind/校验和恢复流程，保证页面提示位变更也进 WAL

# -----------------------------------------------------------------------------
# 4. WAL 归档与证据留存（Archiving & retention）
# -----------------------------------------------------------------------------
# 注意区分两层「归档」：
#   • 应用层（唯一受审计守卫的归档）：services/audit-log/internal/archive 将到期
#     audit_logs/snapshots 段落盘为 audit-archive-<cutoff>-<seq>.ndjson.gz.enc
#     （SM4-GCM/HKDF-SM3）+ .manifest.json（SM3 行链），见 AUDIT_LOG_RETENTION_DAYS。
#   • 数据库层（本段）：WAL 归档用于 PITR，属可选加固项，默认关闭以免依赖外部目录。
# 开启 PITR 时须同步落实归档目录权限、异地保存与留存年限（≥1095 天），否则只是配置装饰。
archive_mode = off                     # 置 on 需同时提供 archive_command 并做留存治理
archive_timeout = 0                    # 不为「按时切段」牺牲写入延迟
#archive_command = 'test ! -f /archive/pg/%f && cp %p /archive/pg/%f'   # 需挂载卷 + 属主正确 + 异地同步
#restore_command = 'cp /archive/pg/%f %p'                               # 仅恢复时启用

# -----------------------------------------------------------------------------
# 5. 检查点与 WAL 规模（Checkpoints）
# -----------------------------------------------------------------------------
checkpoint_timeout = 5min              # 与 log_checkpoints 配套：检查点必须留痕以便核对 WAL 序列
checkpoint_completion_target = 0.9     # 摊薄脏页刷写，避免检查点风暴放大写入抖动
max_wal_size = 2GB                     # 与 compose 中 1G 内存限额匹配；过小会触发紧急检查点
min_wal_size = 80MB

# -----------------------------------------------------------------------------
# 6. 审计可观测性（Server-side audit trail）
# -----------------------------------------------------------------------------
# 容器形态下由 Docker json-file 驱动收集 stdout（compose 已限 max-size/max-file），
# 因此不开 logging_collector，避免日志二次落盘逃逸出集中采集。
logging_collector = off
log_destination = 'stderr'
log_checkpoints = on                   # 检查点/重启点入日志：崩溃后重建 WAL 序列证据（P2-12 明确要求）
log_connections = on                   # 记录连接来源 = 数据库侧访问审计（等保三级：登录行为审计）
log_disconnections = on
log_lock_waits = on                    # 多副本 Hub 租约竞争（FOR UPDATE SKIP LOCKED）阻塞可见
deadlock_timeout = 1s
log_statement = 'ddl'                  # CREATE/ALTER/DROP（含分区与角色变更）必须留痕；全量 all 会存下明文样例数据，故不采
log_min_duration_statement = 500       # 慢查询留痕，但阈值内语句不落日志以防带出敏感参数
log_temp_files = 0                     # 任何落盘临时文件都记录（防大结果集把样本数据写到磁盘却无人知晓）
log_line_prefix = '%m [%p] %q%u@%d %h '  # 时间+PID+用户/库+客户端地址，日志可归因到具体服务账号
log_timezone = 'Asia/Shanghai'
timezone = 'Asia/Shanghai'             # 存证 timestamp 与运维日志同时区，避免跨时区误判留存到期

# -----------------------------------------------------------------------------
# 7. 并发与资源（与容器 limits 对齐）
# -----------------------------------------------------------------------------
# 连接预算按「副本数 × 池上限」计算：SERVICE_HUB_PG_MAX_CONNS(默认 25) 与
# AUDIT_LOG_PG_MAX_CONNS(默认 25) 都是**每个副本**一个池，多副本 Hub（P1-8）扩到
# N 副本即需 25N + 25M；max_connections=200 为该预算留出迁移/运维余量，
# 扩容副本数时须同步上调本值与容器 memory limit。
max_connections = 200
shared_buffers = 256MB                 # 约 compose memory limit 的 1/4，保持容器内保守取值
work_mem = 8MB                         # 单查询内存放大会顶穿 cgroup 限制并触发 OOM
maintenance_work_mem = 64MB            # 分区表建索引/BRIN 时的上限

# -----------------------------------------------------------------------------
# 8. 明确不引入的组件（Scope discipline）
# -----------------------------------------------------------------------------
# 不使用 pg_partman / pg_cron 等外部扩展：证据库的分区生命周期必须可人工审计，
# 由 DBA 按 deploy/sql/audit_partition.sql 预创建下一段分区、并在完成应用层归档后
# DROP PARTITION。shared_preload_libraries 留空即为该约束的显式声明。
shared_preload_libraries = ''
# 不使用 pg_audit / pgaudit 扩展：其策略文件不在本仓交付范围内；如局方要求语句级
# 全量审计，须由 DBA 单独装载并同步 log_statement 与集中采集链路。
