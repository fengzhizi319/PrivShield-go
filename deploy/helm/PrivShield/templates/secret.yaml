# =============================================================================
# PrivShield 敏感数据 Secret（secret.yaml）
# =============================================================================
# 存储 TLS 证书/私钥和 API Key（仅在用户未提供外部 Secret 时创建）。
# 条件：
#   - TLS 启用 + 未指定 existingSecret + 提供了 cert/key 内容
#   - Auth 启用 + 未指定 apiKeysSecret + 提供了 apiKeys 内容
# 生产环境推荐使用外部 Secret（existingSecret/apiKeysSecret），Chart 仅引用不创建。
# =============================================================================
{{- if or (and .Values.security.tls.enabled (not .Values.security.tls.existingSecret) .Values.security.tls.cert) (and .Values.security.auth.enabled (not .Values.security.auth.apiKeysSecret) .Values.security.auth.apiKeys) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "PrivShield.fullname" . }}-secrets
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
type: Opaque
stringData:
  # TLS 证书和私钥（仅在 TLS 启用且未指定 existingSecret 时创建）
  {{- if and .Values.security.tls.enabled (not .Values.security.tls.existingSecret) .Values.security.tls.cert }}
  tls.crt: |
    {{- .Values.security.tls.cert | nindent 4 }}
  tls.key: |
    {{- .Values.security.tls.key | nindent 4 }}
  {{- end }}
  # API Key（仅在 Auth 启用且未指定 apiKeysSecret 时创建）
  # 值格式：token:name:scope1,scope2，多把以 ; 分隔 —— 与 Go 引擎
  # PRIVACY_AUTH_INTERNAL_API_KEYS 的解析口径一致（security/config.go parseAPIKeys）。
  {{- if and .Values.security.auth.enabled (not .Values.security.auth.apiKeysSecret) .Values.security.auth.apiKeys }}
  api-keys: |
    {{- .Values.security.auth.apiKeys | nindent 4 }}
  {{- end }}
{{- end }}
