# =============================================================================
# PrivShield 主服务 Deployment（deployment.yaml）
# =============================================================================
# 定义 PrivShield 主容器的 Deployment，包含 REST + gRPC 双端口。
# 环境变量通过 values.yaml 注入，敏感数据通过 Secret/ConfigMap 卷挂载。
#
# Helm 部署流程：
#   1. helm install 读取 values.yaml（默认值）+ 用户覆盖值（-f / --set）
#   2. Helm 模板引擎将 Go Template 占位符替换为实际值，渲染为纯 K8s YAML
#   3. 渲染后的 YAML 提交给 K8s API Server（等价 kubectl apply）
#   4. K8s 创建 Pod，kubelet 根据 env: 字段注入环境变量到容器
#   5. 容器内进程读取环境变量：engineType=go 时 Go 服务 os.Getenv()，
#      engineType=python 时 Python 服务 os.getenv()。仅某一引擎生效的变量以
#      「# env-scope: python-engine」注释标注（由 scripts/check_orchestration_env_consistency.sh 校验）。
#
# 注意：Helm 本身不"加载"环境变量——它只负责模板渲染。
#       真正注入环境变量的是 K8s kubelet（容器启动时）。
#
# 预览渲染结果：helm template pla ./deploy/helm/PrivShield --debug
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "PrivShield.fullname" . }}
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
spec:
  # HPA 启用时副本数由 HPA 自动管理，此处不设置
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # 滚动更新策略（零停机更新）
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "PrivShield.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Pod 注解（如 Prometheus scrape、Jaeger tracing 等）
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "PrivShield.selectorLabels" . | nindent 8 }}
    spec:
      # 私有镜像仓库认证 Secret
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "PrivShield.serviceAccountName" . }}
      # Pod 级安全上下文（runAsNonRoot/runAsUser/fsGroup）
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # 优雅终止宽限期（SIGTERM 后等待容器自行退出）
      {{- if eq .Values.engineType "go" }}
      terminationGracePeriodSeconds: {{ .Values.goEngine.terminationGracePeriodSeconds | default 15 }}
      {{- else }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # 容器级安全上下文（最小权限原则）
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if eq .Values.engineType "go" }}
          image: "{{ .Values.goEngine.image.repository }}:{{ .Values.goEngine.image.tag }}"
          imagePullPolicy: {{ .Values.goEngine.image.pullPolicy }}
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ include "PrivShield.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.restPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          env:
            # ── 基础配置 ──
            {{- if eq .Values.engineType "go" }}
            # Go 引擎（privshield-agent）只读取 AGENT_* 变量名（services/privacy-engine/internal/config/config.go），
            # 容器编排必须显式置 0.0.0.0，否则仅环回可达、外部容器无法调用。
            - name: AGENT_REST_HOST
              value: "0.0.0.0"
            - name: AGENT_REST_PORT
              value: "{{ .Values.service.restPort }}"
            - name: AGENT_GRPC_HOST
              value: "0.0.0.0"
            - name: AGENT_GRPC_PORT
              value: "{{ .Values.service.grpcPort }}"
            - name: AGENT_LOG_LEVEL
              value: {{ .Values.agent.logLevel | upper | quote }}
            {{- else }}
            # env-scope: python-engine
            - name: PRIVACY_REST_HOST
              value: "0.0.0.0"
            - name: PRIVACY_REST_PORT
              value: "{{ .Values.service.restPort }}"
            # PRIVACY_GRPC_HOST：Python 引擎读取，默认 127.0.0.1；
            # 容器编排必须显式置 0.0.0.0，否则 gRPC 仅环回可达、外部容器无法调用。
            # env-scope: python-engine
            - name: PRIVACY_GRPC_HOST
              value: "0.0.0.0"
            # env-scope: python-engine
            - name: PRIVACY_GRPC_PORT
              value: "{{ .Values.service.grpcPort }}"
            # env-scope: python-engine
            - name: PRIVACY_LOG_LEVEL
              value: {{ .Values.agent.logLevel | upper | quote }}
            {{- end }}
            {{- if ne .Values.engineType "go" }}
            # env-scope: python-engine —— Python 引擎专属读取点：Go 引擎日志固定 JSON（仅
            # AGENT_LOG_LEVEL 可调），参数面走 PRIVACY_CONFIG_FILE + PRIVACY_RULES_DIR。
            - name: PRIVACY_PROFILE
              value: "/etc/PrivShield/privacy-profile.yaml"
            # env-scope: python-engine
            - name: PRIVACY_LOG_FORMAT
              value: {{ .Values.agent.logFormat | quote }}
            {{- end }}
            - name: PRIVACY_SERVICE_NAME
              value: {{ include "PrivShield.fullname" . | quote }}
            # ── OpenTelemetry 可观测性（可选）──
            {{- with .Values.agent.serviceName }}
            {{- if ne $.Values.engineType "go" }}
            # env-scope: python-engine —— Go 引擎只读取 OTEL_EXPORTER_OTLP_ENDPOINT
            #（见 observability/tracing.go），OTEL_SERVICE_NAME 属 Python 引擎/OTel SDK 读取点。
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.agent.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            # ── TLS 加密传输（可选）──
            {{- if .Values.security.tls.enabled }}
            # P0-1 红线：引擎恒定监听 gRPC，TLS 开启即必须提供 CN 白名单文件，
            # 否则白名单拦截器根本不注册（等同未做身份鉴别），Go 侧启动门禁会拒绝启动。
            {{- if not .Values.security.auth.internalMtls.whitelistConfigMap }}
            {{- fail "security.tls.enabled=true 时必须提供 security.auth.internalMtls.whitelistConfigMap（含 mtls-whitelist.yaml 键）：Go 引擎在 TLS+gRPC 开启而无 CN 白名单文件时会被启动门禁拒绝" }}
            {{- end }}
            {{- if eq .Values.engineType "go" }}
            - name: AGENT_TLS_ENABLED
              value: "true"
            - name: AGENT_TLS_CERT_FILE
              value: {{ .Values.security.tls.certFile | quote }}
            - name: AGENT_TLS_KEY_FILE
              value: {{ .Values.security.tls.keyFile | quote }}
            {{- else }}
            # env-scope: python-engine
            - name: PRIVACY_TLS_ENABLED
              value: "true"
            # env-scope: python-engine
            - name: PRIVACY_TLS_CERT_FILE
              value: {{ .Values.security.tls.certFile | quote }}
            # env-scope: python-engine
            - name: PRIVACY_TLS_KEY_FILE
              value: {{ .Values.security.tls.keyFile | quote }}
            {{- end }}
            {{- if ne .Values.engineType "go" }}
            # env-scope: python-engine —— Python 引擎（uvicorn/ssl）读取点。Go 引擎不读这个变量：
            #   客户端证书认证 → AGENT_AUTH_INTERNAL_MTLS_ENABLED + AGENT_AUTH_MTLS_WHITELIST_FILE
            #   加密私钥口令   → Go 的 crypto/tls 不支持带口令私钥，须预先解密后再放进 Secret
            - name: PRIVACY_TLS_CLIENT_AUTH
              value: {{ .Values.security.tls.clientAuth | default "none" | quote }}
            {{- end }}
            {{- if .Values.security.tls.caSecret }}
            {{- if eq .Values.engineType "go" }}
            - name: AGENT_TLS_CA_FILE
              value: {{ .Values.security.tls.caFile | quote }}
            {{- else }}
            # env-scope: python-engine
            - name: PRIVACY_TLS_CA_FILE
              value: {{ .Values.security.tls.caFile | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.security.tls.keyPasswordSecret }}
            {{- if eq .Values.engineType "go" }}
            {{- fail "engineType=go 时不支持 security.tls.keyPasswordSecret：Go 引擎无法解密带口令的私钥，请把 AGENT_TLS_KEY_FILE 指向未加密私钥" }}
            {{- end }}
            # env-scope: python-engine（engineType=go 时上方 fail 已阻断渲染，此变量永不下发到 Go 容器）
            - name: PRIVACY_TLS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.tls.keyPasswordSecret | quote }}
                  key: key-password
            {{- end }}
            {{- end }}
            # ── API Key 认证（P0-1 零信任默认态）──
            # 注意：Go 引擎只读取 AGENT_AUTH_INTERNAL_API_KEYS / AGENT_AUTH_EXTERNAL_API_KEYS
            #（格式 token:name:scope1,scope2，多把以 ; 分隔）。历史模板里的
            # PRIVACY_AUTH_EXTERNAL_KEYS_JSON 在 Go 侧从不被读取，属配置漂移，已停用。
            {{- if .Values.security.auth.enabled }}
            {{- if and (not .Values.security.auth.apiKeysSecret) (not .Values.security.auth.apiKeys) }}
            {{- fail "security.auth.enabled=true 时必须提供 security.auth.apiKeys 或 apiKeysSecret：Go 引擎在非环回监听且无入站 Key 时会被启动门禁拒绝（CrashLoopBackOff）" }}
            {{- end }}
            {{- if eq .Values.engineType "go" }}
            - name: AGENT_AUTH_ENABLED
              value: "true"
            {{- if .Values.security.auth.apiKeysSecret }}
            # 外部 Secret（用户自管，数据键 api-keys）
            - name: AGENT_AUTH_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.auth.apiKeysSecret | quote }}
                  key: api-keys
            {{- else }}
            # Chart 自动生成的 Secret
            - name: AGENT_AUTH_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "PrivShield.fullname" . }}-secrets
                  key: api-keys
            {{- end }}
            {{- else }}
            # env-scope: python-engine
            - name: PRIVACY_AUTH_ENABLED
              value: "true"
            {{- if .Values.security.auth.apiKeysSecret }}
            # 外部 Secret（用户自管，数据键 api-keys）
            # env-scope: python-engine
            - name: PRIVACY_AUTH_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.auth.apiKeysSecret | quote }}
                  key: api-keys
            {{- else }}
            # Chart 自动生成的 Secret
            # env-scope: python-engine
            - name: PRIVACY_AUTH_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "PrivShield.fullname" . }}-secrets
                  key: api-keys
            {{- end }}
            {{- end }}
            {{- end }}
            # ── 内部 mTLS 客户端证书认证（可选）──
            {{- if .Values.security.auth.internalMtls.enabled }}
            {{- if eq .Values.engineType "go" }}
            - name: AGENT_AUTH_INTERNAL_MTLS_ENABLED
              value: "true"
            {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
            - name: AGENT_AUTH_MTLS_WHITELIST_FILE
              value: "/etc/PrivShield/mtls-whitelist.yaml"
            {{- else if .Values.security.auth.internalMtls.allowedCns }}
            - name: AGENT_AUTH_MTLS_ALLOWED_CNS
              value: {{ .Values.security.auth.internalMtls.allowedCns | quote }}
            {{- end }}
            {{- else }}
            # env-scope: python-engine
            - name: PRIVACY_AUTH_INTERNAL_MTLS_ENABLED
              value: "true"
            {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
            - name: PRIVACY_AUTH_MTLS_WHITELIST_FILE
              value: "/etc/PrivShield/mtls-whitelist.yaml"
            {{- else if .Values.security.auth.internalMtls.allowedCns }}
            # env-scope: python-engine
            - name: PRIVACY_AUTH_MTLS_ALLOWED_CNS
              value: {{ .Values.security.auth.internalMtls.allowedCns | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            # ── 速率限制（可选）──
            {{- if .Values.security.rateLimit.enabled }}
            {{- if eq .Values.engineType "go" }}
            - name: AGENT_RATE_LIMIT_ENABLED
              value: "true"
            - name: AGENT_RATE_LIMIT_RPS
              value: {{ .Values.security.rateLimit.defaultRps | quote }}
            - name: AGENT_RATE_LIMIT_BURST
              value: {{ .Values.security.rateLimit.defaultBurst | quote }}
            {{- else }}
            # env-scope: python-engine
            - name: PRIVACY_RATE_LIMIT_ENABLED
              value: "true"
            # env-scope: python-engine
            - name: PRIVACY_RATE_LIMIT_DEFAULT_RPS
              value: {{ .Values.security.rateLimit.defaultRps | quote }}
            # env-scope: python-engine
            - name: PRIVACY_RATE_LIMIT_DEFAULT_BURST
              value: {{ .Values.security.rateLimit.defaultBurst | quote }}
            {{- if .Values.security.rateLimit.redisUrl }}
            # env-scope: python-engine
            - name: PRIVACY_RATE_LIMIT_REDIS_URL
              value: {{ .Values.security.rateLimit.redisUrl | quote }}
            {{- end }}
            {{- if .Values.security.rateLimit.perEndpointJson }}
            # env-scope: python-engine
            - name: PRIVACY_RATE_LIMIT_PER_ENDPOINT_JSON
              value: {{ .Values.security.rateLimit.perEndpointJson | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            # ── Layer-3 LLM 推理服务连接（可选）──
            {{- if .Values.llm.enabled }}
            {{- if eq .Values.engineType "go" }}
            # Go 引擎读取点与 Python 命名不同：PRIVACY_LLM_ENABLE / _ENDPOINT / _MODEL。
            # 端点必须是完整 chat/completions URL（Python 侧的 _API_BASE 只到 /v1，Go 不自动补路径）。
            - name: AGENT_LLM_ENABLE
              value: "true"
            - name: AGENT_LLM_ENDPOINT
              value: "http://{{ include "PrivShield.fullname" . }}-llm:{{ .Values.llm.port }}/v1/chat/completions"
            # P0-5：Go 引擎默认拒绝非环回 http:// 端点；本端点为集群内 vLLM 明文 HTTP，
            # 需显式置 llm.allowInsecureHTTP=true 才下发豁免（默认 false，改用 https 后请置回）。
            - name: AGENT_LLM_ALLOW_INSECURE_HTTP_ENDPOINT
              value: {{ .Values.llm.allowInsecureHTTP | quote }}
            - name: AGENT_LLM_MODEL
              value: {{ .Values.llm.servedModelName | quote }}
            - name: AGENT_LLM_API_KEY
              value: {{ .Values.llm.apiKey | default "EMPTY" | quote }}
            {{- else }}
            # env-scope: python-engine —— 以下三个名字仅 Python 引擎读取
            - name: PRIVACY_LLM_PROVIDER
              value: {{ .Values.llm.provider | default "vllm" | quote }}
            # env-scope: python-engine
            - name: PRIVACY_LLM_API_BASE
              value: "http://{{ include "PrivShield.fullname" . }}-llm:{{ .Values.llm.port }}/v1"
            # env-scope: python-engine
            - name: PRIVACY_LLM_MODEL_NAME
              value: {{ .Values.llm.servedModelName | quote }}
            - name: AGENT_LLM_API_KEY
              value: {{ .Values.llm.apiKey | default "EMPTY" | quote }}
            {{- end }}
            {{- end }}
            # ── 额外环境变量（用户自定义）──
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # 配置文件卷（privacy-profile.yaml）
            - name: config
              mountPath: /etc/PrivShield
              readOnly: true
            # TLS 证书卷（可选）
            {{- if .Values.security.tls.enabled }}
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
            # CA 证书（可选，mTLS 场景）
            {{- if .Values.security.tls.caSecret }}
            - name: ca-cert
              mountPath: {{ .Values.security.tls.caFile }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
            # mTLS CN 白名单 ConfigMap（可选）
            {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
            - name: mtls-whitelist
              mountPath: /etc/PrivShield/mtls-whitelist.yaml
              subPath: mtls-whitelist.yaml
              readOnly: true
            {{- end }}
            # 额外卷挂载（用户自定义）
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # ── 探针配置 ──
          # TLS 启用时使用 exec 探针（curl/wget 加 -k 跳过证书校验）
          # TLS 未启用时使用 httpGet 探针（更轻量）
          {{- if .Values.security.tls.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS -k https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.liveness.path }} || wget -qO- --no-check-certificate https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.liveness.path }}"
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS -k https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.readiness.path }} || wget -qO- --no-check-certificate https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.readiness.path }}"
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -fsS -k https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.startup.path }} || wget -qO- --no-check-certificate https://localhost:{{ .Values.service.restPort }}{{ .Values.probes.startup.path }}"
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          # 资源限制（CPU/内存）
          {{- if eq .Values.engineType "go" }}
          resources:
            {{- toYaml .Values.goEngine.resources | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
      # ── 卷定义 ──
      volumes:
        # 配置文件卷（从 ConfigMap 挂载 privacy-profile.yaml）
        - name: config
          configMap:
            name: {{ include "PrivShield.fullname" . }}-config
        # TLS 证书卷（从 Secret 挂载）
        {{- if .Values.security.tls.enabled }}
        - name: tls-certs
          secret:
            {{- if .Values.security.tls.existingSecret }}
            secretName: {{ .Values.security.tls.existingSecret | quote }}
            {{- else }}
            secretName: {{ include "PrivShield.fullname" . }}-secrets
            {{- end }}
        {{- if .Values.security.tls.caSecret }}
        - name: ca-cert
          secret:
            secretName: {{ .Values.security.tls.caSecret | quote }}
        {{- end }}
        {{- end }}
        # mTLS CN 白名单 ConfigMap 卷
        {{- if .Values.security.auth.internalMtls.whitelistConfigMap }}
        - name: mtls-whitelist
          configMap:
            name: {{ .Values.security.auth.internalMtls.whitelistConfigMap | quote }}
        {{- end }}
        # 额外卷（用户自定义）
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      # ── 节点调度 ──
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
