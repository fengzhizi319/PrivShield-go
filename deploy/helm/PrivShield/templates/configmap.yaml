# =============================================================================
# PrivShield 配置 ConfigMap（configmap.yaml）
# =============================================================================
# 存储 privacy-profile.yaml 配置文件，挂载到容器 /etc/PrivShield/ 目录。
# 仅 engineType=python 时生效：Python 引擎通过 PRIVACY_PROFILE 读取本文件并按 primitives 段覆盖默认参数；
# Go 引擎改读 PRIVACY_CONFIG_FILE（config/privacy.yaml）+ PRIVACY_RULES_DIR，不读取本 profile 文件。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "PrivShield.fullname" . }}-config
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
data:
  # privacy-profile.yaml 内容（来自 values.yaml 的 agent.profile）
  privacy-profile.yaml: |
    {{- .Values.agent.profile | nindent 4 }}
