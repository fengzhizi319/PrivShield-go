# =============================================================================
# Layer-3 LLM 推理服务 Service（llm-service.yaml）
# =============================================================================
# 为 LLM Deployment 提供集群内部稳定访问入口（<fullname>-llm:<port>）。
# core 通过环境变量调用（deployment.yaml 按 engineType 注入）：Go 引擎为 PRIVACY_LLM_ENDPOINT
# （完整 /v1/chat/completions URL），Python 引擎为 PRIVACY_LLM_API_BASE（到 /v1 为止）。
# 仅在 llm.enabled=true 时创建。
# =============================================================================
{{- if .Values.llm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "PrivShield.fullname" . }}-llm
  labels:
    {{- include "PrivShield.labels" . | nindent 4 }}
    # 组件标签：区分 LLM 和 core
    app.kubernetes.io/component: llm
spec:
  # ClusterIP 类型（仅集群内部访问）
  type: ClusterIP
  # 通过 selectorLabels + component 标签匹配 LLM Pod
  selector:
    {{- include "PrivShield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm
  ports:
    - name: http
      port: {{ .Values.llm.port }}
      targetPort: http
{{- end }}
