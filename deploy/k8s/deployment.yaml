apiVersion: apps/v1
kind: Deployment
metadata:
  name: PrivShield
  namespace: PrivShield
  labels:
    app: PrivShield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PrivShield
  template:
    metadata:
      labels:
        app: PrivShield
    spec:
      # Pod 级安全上下文：强制非 root 运行、卷文件属组
      # 与 Helm chart values.yaml podSecurityContext 对齐
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # 优雅终止宽限期：gRPC GracefulStop 30s + 余量
      terminationGracePeriodSeconds: 40
      containers:
        - name: agent
          image: privshield:1.8.0
          imagePullPolicy: IfNotPresent
          # 容器级安全上下文：最小权限原则
          # 与 Helm chart values.yaml securityContext 对齐
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8079
            - name: grpc
              containerPort: 50051
          env:
            - name: PRIVACY_REST_HOST
              value: "0.0.0.0"
            - name: PRIVACY_REST_PORT
              value: "8079"
            - name: PRIVACY_GRPC_HOST
              value: "0.0.0.0"
            - name: PRIVACY_GRPC_PORT
              value: "50051"
            - name: PRIVACY_PROFILE
              value: "/etc/PrivShield/privacy-profile.yaml"
            - name: PRIVACY_LOG_LEVEL
              value: "INFO"
            - name: PRIVACY_LOG_FORMAT
              value: "text"
            # 如需启用 TLS，取消下面注释并确保证书 Secret 已创建。
            # ⚠️ P0-1 红线：TLS 开启且引擎监听 gRPC 时，还必须同时提供客户端证书 CN 白名单文件
            #（PRIVACY_AUTH_MTLS_WHITELIST_FILE，指向含 mtls-whitelist.yaml 键的 ConfigMap），
            # 否则白名单拦截器根本不注册，启动门禁会拒绝启动。
            # - name: PRIVACY_TLS_ENABLED
            #   value: "true"
            # - name: PRIVACY_TLS_CERT_FILE
            #   value: "/certs/tls.crt"
            # - name: PRIVACY_TLS_KEY_FILE
            #   value: "/certs/tls.key"
            # ── 认证：P0-1 零信任默认态，**默认开启**（不再可选）──
            # 本容器绑定 0.0.0.0 属「非环回暴露」，无入站 Key 时 Go 引擎直接拒绝启动，
            # 因此部署前必须先创建 Secret（不存在「漏配即静默无鉴权」的中间态）：
            #   kubectl create secret generic privshield-apikeys \
            #     --from-literal=api-keys='<随机token>:console:mask,dp,classify'
            # 变量名用 PRIVACY_AUTH_INTERNAL_API_KEYS（格式 token:name:scope1,scope2;…）；
            # 旧写法 PRIVACY_AUTH_EXTERNAL_KEYS_JSON 在 Go 侧从不被读取，已停用。
            - name: PRIVACY_AUTH_ENABLED
              value: "true"
            - name: PRIVACY_AUTH_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: privshield-apikeys
                  key: api-keys
            # 如需启用 Layer-3 LLM 独立推理服务（运行时解耦），取消下面注释并部署
            # llm-deployment.yaml / llm-service.yaml（LLM 挂掉时 core 自动降级 Layer-1+2）：
            # - name: PRIVACY_LLM_PROVIDER
            #   value: "vllm"
            # - name: PRIVACY_LLM_API_BASE
            #   value: "http://PrivShield-llm:8000/v1"
            # - name: PRIVACY_LLM_MODEL_NAME
            #   value: "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
            # - name: PRIVACY_LLM_API_KEY
            #   value: "EMPTY"
          volumeMounts:
            - name: config
              mountPath: /etc/PrivShield
              readOnly: true
            # - name: tls-certs
            #   mountPath: /certs
            #   readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              # /readyz 校验配置解析器与隐私预算 DB 连通性；liveness 保持 /health
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # startupProbe: 启动探针——保护慢启动应用（如 ML 模型加载）
          # 在 startupProbe 成功前，liveness/readiness 探针不会生效，
          # 避免 K8s 在应用尚未就绪时过早重启 Pod。
          # 最多允许 30 × 5s = 150s 启动时间。
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: PrivShield-config
        # - name: tls-certs
        #   secret:
        #     secretName: PrivShield-tls
