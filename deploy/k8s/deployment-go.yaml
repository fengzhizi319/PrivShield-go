# =============================================================================
# PrivShield Go Engine Deployment (K8s)
# PrivShield Go 原生引擎 K8s 部署清单
#
# 与 deployment.yaml 的区别：
#   - deployment.yaml: Python 引擎（privshield:1.8.0，含 PyTorch/ML 依赖）
#   - 本文件: Go 原生引擎（privshield-go:1.0.0，极小镜像，无 ML 依赖）
#
# Go 引擎优势：
#   - 镜像大小 ~15MB（Python 引擎 ~1.5GB core / ~5GB ml）
#   - 启动时间 <1s（Python 引擎 5-30s）
#   - 内存占用 <100MB（Python 引擎 256MB-2GB）
#   - 无 Python/PyTorch/ONNX 运行时依赖
#
# 使用方式：
#   替换 deployment.yaml 使用：
#     kubectl apply -f deploy/k8s/deployment-go.yaml
#   或通过 kustomization 选择：
#     在 deploy/k8s/kustomization.yaml 中注释 deployment.yaml，启用 deployment-go.yaml
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PrivShield-Go
  namespace: PrivShield
  labels:
    app: PrivShield-Go
    engine-type: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: PrivShield-Go
  template:
    metadata:
      labels:
        app: PrivShield-Go
        engine-type: go
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Go 引擎优雅关闭更快，15s 足够
      terminationGracePeriodSeconds: 20
      containers:
        - name: agent
          image: privshield-go:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8079
            - name: grpc
              containerPort: 50051
          env:
            - name: AGENT_REST_HOST
              value: "0.0.0.0"
            - name: AGENT_REST_PORT
              value: "8079"
            - name: AGENT_GRPC_HOST
              value: "0.0.0.0"
            - name: AGENT_GRPC_PORT
              value: "50051"
            - name: AGENT_LOG_LEVEL
              value: "INFO"
            # Go 引擎日志固定 JSON 输出（无 PRIVACY_LOG_FORMAT 读取点），仅 AGENT_LOG_LEVEL 可调。
            # ── 认证：P0-1 零信任默认态，**必须开启** ──
            # 本容器绑定 0.0.0.0 属「非环回暴露」，Go 引擎启动门禁在无入站 Key 时直接拒绝启动
            #（不存在「漏配即静默无鉴权」的中间态），因此部署前必须先创建 Secret：
            #   kubectl create secret generic privshield-apikeys \
            #     --from-literal=api-keys='<随机token>:console:mask,dp,classify'
            - name: AGENT_AUTH_ENABLED
              value: "true"
            - name: AGENT_AUTH_INTERNAL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: privshield-apikeys
                  key: api-keys
            # 如需启用 TLS，取消下面注释并确保证书 Secret 已创建。
            # ⚠️ P0-1 红线：TLS 开启且引擎监听 gRPC 时，还必须同时提供客户端证书 CN 白名单文件
            #（AGENT_AUTH_MTLS_WHITELIST_FILE，指向含 mtls-whitelist.yaml 键的 ConfigMap），
            # 否则白名单拦截器根本不注册，启动门禁会拒绝启动。
            # - name: AGENT_TLS_ENABLED
            #   value: "true"
            # - name: AGENT_TLS_CERT_FILE
            #   value: "/certs/tls.crt"
            # - name: AGENT_TLS_KEY_FILE
            #   value: "/certs/tls.key"
            # - name: AGENT_AUTH_MTLS_WHITELIST_FILE
            #   value: "/etc/PrivShield/mtls-whitelist.yaml"
            # 如需启用 Layer-3 LLM（Go 读取点，端点须为完整 chat/completions URL）：
            # - name: PRIVACY_LLM_ENABLE
            #   value: "true"
            # - name: PRIVACY_LLM_ENDPOINT
            #   value: "http://PrivShield-llm:8000/v1/chat/completions"
            # - name: PRIVACY_LLM_ALLOW_INSECURE_HTTP_ENDPOINT
            #   value: "true"   # P0-5：非环回 http:// 端点默认被拒，明文内网需显式豁免
            # - name: PRIVACY_LLM_MODEL
            #   value: "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
          # Go 引擎启动极快，探针配置更紧凑
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 10
          # Go 引擎资源消耗远低于 Python
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
