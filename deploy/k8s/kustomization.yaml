apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: PrivShield
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # 使用自管证书/密钥时取消下面注释
  # - secret.example.yaml
  # 启用 Layer-3 LLM 独立推理服务（GPU，运行时解耦）时取消下面注释：
  # LLM 升级/重启不影响 core；LLM 挂掉时 core 自动降级 Layer-1+2
  # - llm-deployment.yaml
  # - llm-service.yaml
  # ── Go 微服务群（下沉各服务自包含部署清单）──
  - ../../services/service-hub/deploy/k8s
  - ../../console/mock-datasource/deploy/k8s
  - ../../services/audit-log/deploy/k8s
  # ── 统一控制台（Go BFF + Web 前端自包含部署清单）──
  - ../../console/deploy/k8s
