# =============================================================================
# PrivShield - Go Engine Override for docker-compose.dev.yml
# PrivShield - Go 原生引擎替代覆盖层（开发模式）
#
# 使用方式 / Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev-go-engine.yml up -d
#
# 或通过脚本启动：
#   bash scripts/dev/docker-start-bff-go-agent.sh
#
# 说明：
#   本文件覆盖 docker-compose.dev.yml 中的 PrivShield 服务定义，
#   将 Python 引擎替换为 Go 原生引擎（engine-go/Dockerfile 构建）。
#   Go 引擎镜像极小（~15MB），启动速度快（<1s），无 Python/ML 依赖。
#   开发模式下：纯文本日志、关闭 TLS、挂载 budget-db 卷。
#
# 环境变量：
#   PRIVSHIELD_GO_IMAGE: Go 引擎镜像名（默认 privshield-go:1.0.0）
# =============================================================================

services:

  # 覆盖 docker-compose.dev.yml 中的 PrivShield 服务定义
  PrivShield:
    # 使用 Go 引擎镜像
    image: ${PRIVSHIELD_GO_IMAGE:-privshield-go:1.0.0}
    # Go 引擎不需要本地构建（由启动脚本预先构建）
    build: null
    pull_policy: if_not_present
    container_name: PrivShield-Go-dev
    environment:
      # Go 引擎基础配置（agent 只读 AGENT_* 变量名，见 engine-go/internal/config/config.go）
      AGENT_REST_HOST: "0.0.0.0"
      AGENT_REST_PORT: "8079"
      AGENT_GRPC_HOST: "0.0.0.0"
      AGENT_GRPC_PORT: "50051"
      AGENT_LOG_LEVEL: "${PRIVACY_LOG_LEVEL:-DEBUG}"
      PRIVACY_SERVICE_NAME: "PrivShield-Go-Dev"
      # 开发模式：关闭 TLS；鉴权按 P0-1 不可关闭（0.0.0.0 监听且无入站 Key 会被启动门禁直接拒绝）
      AGENT_TLS_ENABLED: "false"
      AGENT_AUTH_ENABLED: "true"
      AGENT_AUTH_INTERNAL_API_KEYS: "${PRIVSHIELD_ENGINE_API_KEY:-dev-engine-key}:dev-go-engine:*"
      AGENT_RATE_LIMIT_ENABLED: "false"
      # Layer-3 LLM：dev.yml 声明的是 Python 命名（PROVIDER/API_BASE/MODEL_NAME），Go 引擎不读取，
      # 故在此覆盖为 Go 侧真实读取点；默认 false，需要 LLM 时置 PRIVACY_LLM_ENABLE=true。
      PRIVACY_LLM_ENABLE: "${PRIVACY_LLM_ENABLE:-false}"
      PRIVACY_LLM_ENDPOINT: "${LLM_API_BASE:-http://vllm:8000/v1/chat/completions}"
      # P0-5：非环回 http:// 端点默认被拒，容器内网调用需显式声明豁免开关。
      PRIVACY_LLM_ALLOW_INSECURE_HTTP_ENDPOINT: "${PRIVACY_LLM_ALLOW_INSECURE_HTTP_ENDPOINT:-false}"
      PRIVACY_LLM_MODEL: "${PRIVACY_LLM_MODEL:-Qwen3.5-0.8B-Privacy-Classifier-Smoother}"
    # Go 引擎不需要 Python 源码挂载，仅保留数据卷
    volumes:
      - budget-db-dev:/data/budget
    # Go 引擎启动极快，healthcheck 间隔缩短
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8079/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Go 引擎资源消耗远低于 Python 引擎（开发模式轻量配额）
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 32M
    # Go 引擎 gRPC GracefulStop 更快
    stop_grace_period: 15s
    restart: "no"
