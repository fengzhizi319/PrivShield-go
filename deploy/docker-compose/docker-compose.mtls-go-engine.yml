# =============================================================================
# PrivShield - mTLS Mutual TLS Security Overlay for Go Engine
# PrivShield - Go 原生引擎 mTLS 双向认证覆盖层
# =============================================================================
# 用法 / Usage:
#   docker compose -f docker-compose.yml -f docker-compose.go-engine.yml -f docker-compose.mtls-go-engine.yml up -d
# =============================================================================

services:

  # 1. PrivShield-Go 引擎 (mTLS 双向认证 + HTTPS REST)
  PrivShield:
    environment:
      AGENT_TLS_ENABLED: "true"
      AGENT_TLS_CERT_FILE: "/certs/server.crt"
      AGENT_TLS_KEY_FILE: "/certs/server.key"
      AGENT_TLS_CA_FILE: "/certs/ca.crt"
      AGENT_AUTH_INTERNAL_MTLS_ENABLED: "true"
      AGENT_AUTH_MTLS_ALLOWED_CNS: '["privshield-client", "privacy-console-go-client"]'
      # P0-1：TLS + gRPC 开启 ⇒ CN 白名单文件必填（缺失即拦截器不注册 → 门禁拒绝启动）
      AGENT_AUTH_MTLS_WHITELIST_FILE: "/etc/PrivShield/mtls-whitelist.yaml"
    volumes:
      - ../../console/engine-console/bff-go/certs:/certs:ro
      - ../../config/mtls-whitelist.yaml:/etc/PrivShield/mtls-whitelist.yaml:ro
      - budget-db:/data/budget
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8079/readyz || wget --no-check-certificate -qO- https://localhost:8079/health || exit 1"]

  # 2. Console Go 后端代理服务 (mTLS 客户端连接 Go Agent)
  console-backend-go:
    environment:
      BFF_AGENT_TLS_ENABLED: "true"
      BFF_AGENT_TLS_CA_FILE: "/certs/ca.crt"
      BFF_AGENT_TLS_CERT_FILE: "/certs/client.crt"
      BFF_AGENT_TLS_KEY_FILE: "/certs/client.key"
      BFF_AGENT_TLS_SERVER_NAME: "PrivShield"
      BFF_AGENT_URL: "https://PrivShield:8079"
      PRIVACY_AUTH_MTLS_WHITELIST_FILE: "/etc/PrivShield/mtls-whitelist.yaml"
    volumes:
      - ../../console/engine-console/bff-go/certs:/certs:ro
      - ../../config/mtls-whitelist.yaml:/etc/PrivShield/mtls-whitelist.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
