# =============================================================================
# PrivShield - Docker Compose App-LZ 调度之眼全景测试集群编排
# PrivShield - App-LZ Service Hub Testing Orchestration
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  budget-db:
    driver: local
  audit-logs:
    driver: local
  service-hub-data:
    driver: local
  datasource-mgr-data:
    driver: local
  audit-log-data:
    driver: local

services:
  # 1. PrivShield 引擎 Sidecar (:8079 / :50051)
  PrivShield:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: core
    image: privshield:1.8.0
    pull_policy: build
    container_name: PrivShield
    ports:
      - "8079:8079"
      - "50051:50051"
    environment:
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_LOG_FORMAT: "json"
      PRIVACY_PROFILE: "/etc/PrivShield/privacy-profile.yaml"
      PRIVACY_BUDGET_DB: "/data/budget/budget.db"
      # P0-1：0.0.0.0 监听 ⇒ 必须配置入站 Key（留空即启动门禁拒绝），
      # 下面这把 dev-* 明文密钥只供本机联调，任何可路由环境都要换成 .env 里的真实值。
      PRIVACY_AUTH_ENABLED: "true"
      PRIVACY_AUTH_INTERNAL_API_KEYS: "${PRIVSHIELD_ENGINE_API_KEY:-dev-engine-key}:dev-app-lz:*"
    volumes:
      - ./privacy-profile.yaml:/etc/PrivShield/privacy-profile.yaml:ro
      - ../../docs/standard:/app/docs/standard:ro
      - budget-db:/data/budget
      - audit-logs:/var/log/privacy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"

  # 2. Service Hub 调度中枢 (:8082 / :50052)
  service-hub:
    build:
      context: ../..
      dockerfile: services/service-hub/Dockerfile
    image: privshield-service-hub:1.8.0
    pull_policy: build
    container_name: privshield-service-hub
    ports:
      - "8082:8082"
      - "50052:50052"
    environment:
      SERVICE_HUB_HOST: "0.0.0.0"
      SERVICE_HUB_PORT: "8082"
      SERVICE_HUB_GRPC_PORT: "50052"
      # 上游地址必须用代码真实读取的变量名（原 SERVICE_HUB_AGENT_ADDR / _AGENT_HTTP /
      # _DATASOURCE_ADDR / _DATASOURCE_HTTP / _AUDIT_ADDR 均不被读取，中枢会退回 127.0.0.1
      # 默认值而找不到任何上游，已按 P2-1 修正）。中枢侧引擎客户端是纯 REST 实现。
      PRIVACY_AGENT_REST_HOST: "PrivShield"
      PRIVACY_REST_PORT: "8079"
      DATASOURCE_MGR_HOST: "datasource-mgr"
      DATASOURCE_MGR_PORT: "8083"
      DATASOURCE_MGR_GRPC_HOST: "datasource-mgr"
      DATASOURCE_MGR_GRPC_PORT: "50053"
      SERVICE_HUB_AUDIT_HTTP: "http://audit-log:8084"
      # 注：本服务没有「存储后端开关」类变量（原 SERVICE_HUB_STORE_BACKEND / SERVICE_HUB_SQLITE_PATH
      # 是从不被代码读取的幽灵变量，已按 P2-1 删除）；后端由 SERVICE_HUB_PG_DSN 是否配置决定，
      # SQLite 路径的真实变量名是 SERVICE_HUB_DB_PATH。
      SERVICE_HUB_DB_PATH: "/data/service-hub.db"
      # ── P0-1 零信任默认态：入站 Key + 三个出站 Key（须与对端入站值一致）──
      SERVICE_HUB_API_KEY: "${SERVICE_HUB_API_KEY:-dev-service-hub-key}"
      PRIVACY_AGENT_API_KEY: "${PRIVSHIELD_ENGINE_API_KEY:-dev-engine-key}"
      SERVICE_HUB_DATASOURCE_API_KEY: "${DATASOURCE_MGR_API_KEY:-dev-datasource-key}"
      SERVICE_HUB_AUDIT_LOG_API_KEY: "${AUDIT_LOG_API_KEY:-dev-audit-key}"
    volumes:
      - service-hub-data:/data
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"

  # 3. Datasource Mgr 数据源管理 (:8083 / :50053)
  datasource-mgr:
    build:
      context: ../..
      dockerfile: services/datasource-mgr/Dockerfile
    image: privshield-datasource-mgr:1.8.0
    pull_policy: build
    container_name: privshield-datasource-mgr
    ports:
      - "8083:8083"
      - "50053:50053"
    environment:
      DATASOURCE_MGR_HOST: "0.0.0.0"
      DATASOURCE_MGR_PORT: "8083"
      DATASOURCE_MGR_GRPC_PORT: "50053"
      # 注：本服务**没有**数据库/存储类环境变量（原 DATASOURCE_MGR_SQLITE_PATH 是从不被代码读取的
      # 幽灵变量，已按 P2-1 删除）；示范数据源为 samples/*.csv 真实同构模拟库，/data 卷仅承载上传临时文件。
      # P0-1：0.0.0.0 监听 ⇒ 必须配置入站 Key（本服务的 Key 同时是 hub / BFF 的出站值）。
      DATASOURCE_MGR_API_KEY: "${DATASOURCE_MGR_API_KEY:-dev-datasource-key}"
    volumes:
      - datasource-mgr-data:/data
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"

  # 4. Audit Log 审计存证 (:8084 / :50054)
  audit-log:
    build:
      context: ../..
      dockerfile: services/audit-log/Dockerfile
    image: privshield-audit-log:1.8.0
    pull_policy: build
    container_name: privshield-audit-log
    ports:
      - "8084:8084"
      - "50054:50054"
    environment:
      AUDIT_LOG_HOST: "0.0.0.0"
      AUDIT_LOG_PORT: "8084"
      AUDIT_LOG_GRPC_PORT: "50054"
      # 真实变量名是 AUDIT_LOG_DB_PATH（原 AUDIT_LOG_SQLITE_PATH 不被代码读取，属 P2-1 配置漂移）。
      AUDIT_LOG_DB_PATH: "/data/audit-log.db"
      # ── P0-1 启动门禁必填：入站 Key + P0-3 快照加密主密钥 + P1-2 哈希链 HMAC 密钥 ──
      AUDIT_LOG_API_KEY: "${AUDIT_LOG_API_KEY:-dev-audit-key}"
      AUDIT_LOG_ENCRYPTION_KEY: "${AUDIT_LOG_ENCRYPTION_KEY:-dev-audit-encryption-key-change-me}"
      AUDIT_LOG_HASH_KEY: "${AUDIT_LOG_HASH_KEY:-dev-audit-hash-key-change-me}"
      # P0-4：禁止静音降级；P0-8：0 = 永不物理删除存证。
      AUDIT_LOG_STRICT_STORAGE: "true"
      AUDIT_LOG_RETENTION_DAYS: "0"
    volumes:
      - audit-log-data:/data
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"

  # 5. App-LZ Go BFF 外部模拟业务程序 (:8085，仅访问 service-hub 调度中枢)
  # 架构原则：app-lz 模拟外部系统，除 service-hub 外无权直连任何内部服务 (datasource-mgr / engine-go / audit-log)
  app-lz-bff:
    build:
      context: ../..
      dockerfile: console/app-lz/bff-go/Dockerfile
    image: privshield-app-lz-bff:1.8.0
    pull_policy: build
    container_name: privshield-app-lz-bff
    ports:
      - "8085:8085"
    environment:
      APP_LZ_HOST: "0.0.0.0"
      APP_LZ_PORT: "8085"
      # ── 唯一调度编排中枢 ──
      APP_LZ_HUB_URL: "http://service-hub:8082"
      APP_LZ_HUB_GRPC: "service-hub:50052"
      # ── 入站 Key 与 service-hub 出站调用凭证 ──
      APP_LZ_API_KEY: "${APP_LZ_API_KEY:-dev-app-lz-bff-key}"
      APP_LZ_HUB_API_KEY: "${SERVICE_HUB_API_KEY:-dev-service-hub-key}"
    depends_on:
      service-hub:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"

  # 6. App-LZ React 前端大屏 (:5174 Nginx 托管)
  app-lz-web:
    build:
      context: ../../console/app-lz/web
      dockerfile: Dockerfile
    image: privshield-app-lz-web:1.8.0
    pull_policy: build
    container_name: privshield-app-lz-web
    ports:
      - "5174:5174"
    depends_on:
      app-lz-bff:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"
