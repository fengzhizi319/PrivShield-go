# =============================================================================
# PrivShield - Go Engine Override for docker-compose.prod.yml
# PrivShield - Go 原生引擎替代覆盖层（生产模式）
#
# 使用方式 / Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-go-engine.yml up -d
#
# 或通过脚本启动：
#   bash scripts/prod/deploy-docker-compose.sh --go-engine
#
# 说明：
#   本文件覆盖 docker-compose.prod.yml 中的 PrivShield 服务定义，
#   将引擎镜像替换为 Go 原生引擎（engine-go/Dockerfile 构建）。
#   Go 引擎镜像极小（~15MB），启动速度快（<1s），无 Python/ML 依赖。
#   生产模式下：JSON 日志、安全加固（no-new-privileges）、自动重启。
#
# ⚠️ Compose 合并语义提醒：`environment` 按变量名逐条合并，本文件一旦重新声明某个键，
#   就会**覆盖**父文件 docker-compose.prod.yml 的同名取值。因此本文件必须与生产加固基线
#   保持一致（TLS / 鉴权 / 限流 / REQUIRE_TLS 全为强制开启），不得在这里回落到「关闭」默认。
#
# 环境变量：
#   PRIVSHIELD_GO_IMAGE: Go 引擎镜像名（默认 privshield-go:1.0.0）
# =============================================================================

services:

  # 覆盖 docker-compose.prod.yml 中的 PrivShield 服务定义
  PrivShield:
    # 使用 Go 引擎镜像
    image: ${PRIVSHIELD_GO_IMAGE:-privshield-go:1.0.0}
    # Go 引擎不需要本地构建
    build: null
    pull_policy: if_not_present
    container_name: PrivShield-Go-prod
    # 生产安全加固
    security_opt:
      - no-new-privileges:true
    environment:
      # Go 引擎基础配置
      # PRIVACY_GRPC_HOST：config.go 读取点（默认 127.0.0.1），容器编排必须显式置 0.0.0.0 否则外部不可达。
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_LOG_LEVEL: "${PRIVACY_LOG_LEVEL:-INFO}"
      PRIVACY_SERVICE_NAME: "PrivShield-Go"
      # 分类分级规则与 Profile 路径（Go 引擎读取的真实变量名）
      PRIVACY_CONFIG_FILE: "${PRIVACY_CONFIG_FILE:-/app/config/privacy.yaml}"
      PRIVACY_RULES_DIR: "${PRIVACY_RULES_DIR:-/app/rules/domains}"
      # ── 生产安全基线（与 docker-compose.prod.yml 一致，缺密钥/证书即拒绝启动）──
      PRIVACY_TLS_ENABLED: "true"
      PRIVACY_REQUIRE_TLS: "${PRIVACY_REQUIRE_TLS:-true}"
      PRIVACY_TLS_CERT_FILE: "${PRIVACY_TLS_CERT_FILE:-/certs/agent/tls.crt}"
      PRIVACY_TLS_KEY_FILE: "${PRIVACY_TLS_KEY_FILE:-/certs/agent/tls.key}"
      PRIVACY_TLS_CA_FILE: "${PRIVACY_TLS_CA_FILE:-/certs/ca.crt}"
      PRIVACY_AUTH_INTERNAL_MTLS_ENABLED: "${PRIVACY_AUTH_INTERNAL_MTLS_ENABLED:-true}"
      PRIVACY_AUTH_MTLS_WHITELIST_FILE: "${PRIVACY_AUTH_MTLS_WHITELIST_FILE:?PRIVACY_AUTH_MTLS_WHITELIST_FILE is required in production (e.g. /etc/PrivShield/secrets/mtls-whitelist.yaml)}"
      PRIVACY_AUTH_ENABLED: "true"
      PRIVACY_AUTH_INTERNAL_API_KEYS: "${PRIVACY_AUTH_INTERNAL_API_KEYS:?PRIVACY_AUTH_INTERNAL_API_KEYS is required in production (format token:name:scopes;...)}"
      PRIVACY_AUTH_EXTERNAL_API_KEYS: "${PRIVACY_AUTH_EXTERNAL_API_KEYS:?PRIVACY_AUTH_EXTERNAL_API_KEYS is required in production}"
      PRIVACY_RATE_LIMIT_ENABLED: "true"
      PRIVACY_RATE_LIMIT_DEFAULT_RPS: "${PRIVACY_RATE_LIMIT_DEFAULT_RPS:-50}"
      PRIVACY_RATE_LIMIT_DEFAULT_BURST: "${PRIVACY_RATE_LIMIT_DEFAULT_BURST:-100}"
      PRIVACY_RATE_LIMIT_REDIS_URL: "${PRIVACY_RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}"
    # Go 引擎只需要证书 / 白名单挂载（Python 时代的 profile 与预算库挂载不再需要）
    volumes:
      - ./certs:/certs:ro
      - ./secrets:/etc/PrivShield/secrets:ro
      - budget-db:/data/budget
    # Go 引擎 healthcheck（TLS 开启后走 https，内部 CA 不在容器信任库内故用 -k）
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:8079/readyz || wget -qO- http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Go 引擎资源配额（生产级，远低于 Python 引擎）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    # Go 引擎 gRPC GracefulStop 更快
    stop_grace_period: 15s
    # 生产模式：自动重启
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
