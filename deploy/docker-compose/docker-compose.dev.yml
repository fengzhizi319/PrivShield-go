# =============================================================================
# PrivShield - 开发与本地调试 Docker Compose 编排 (Development Orchestration)
# =============================================================================
# 开发联调专用编排文件，特点：
#   1. 挂载宿主机源码目录（热重载，修改代码无需重新 build 镜像）
#   2. 纯文本控制台日志 (PRIVACY_LOG_FORMAT: text)，清晰易读
#   3. 关闭 TLS 与 API Key 鉴权，支持浏览器 / Postman / curl 直连调试
#   4. 暴露全部服务的 HTTP / gRPC / 调试端口
#   5. 轻量资源配额，降低本机 CPU/内存占用
#
# 🚀 启动方式 / Usage:
#   # 启动全部核心开发组件 (Agent + Go 代理 + 前端 Web)
#   docker compose -f docker-compose.dev.yml up -d
#
#   # 启动并启用 vLLM 本地大模型容器 (需 GPU)
#   docker compose -f docker-compose.dev.yml --profile llm up -d
#
#   # 启动并启用监控套件
#   docker compose -f docker-compose.dev.yml --profile monitoring up -d
#
#   # 启动 Phase B PostgreSQL（多副本 Hub 模式）
#   docker compose -f docker-compose.dev.yml --profile phase-b up -d
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: false  # 开发环境允许直接访问后端容器
  llm:
    driver: bridge
    internal: false

volumes:
  budget-db-dev:
    driver: local
  audit-logs-dev:
    driver: local
  prometheus-data-dev:
    driver: local
  grafana-data-dev:
    driver: local
  phase-b-pg-data-dev:
    driver: local
  # 微服务 SQLite 持久化卷
  service-hub-data-dev:
    driver: local
  datasource-mgr-data-dev:
    driver: local
  audit-log-data-dev:
    driver: local

services:

  # 1. PrivShield 核心 Agent (开发模式：挂载源码 + 文本日志 + 免密)
  PrivShield:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: core
    image: privshield:1.8.0-dev
    container_name: PrivShield-dev
    ports:
      - "8079:8079"   # REST API
      - "50051:50051" # gRPC
    environment:
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_SERVICE_NAME: "PrivShield-dev"
      PRIVACY_LOG_LEVEL: "DEBUG"
      PRIVACY_LOG_FORMAT: "text"
      PRIVACY_PROFILE: "/etc/PrivShield/privacy-profile.yaml"
      PRIVACY_BUDGET_DB: "/data/budget/budget.db"
      PRIVACY_TLS_ENABLED: "false"
      # P0-1 零信任默认态：0.0.0.0 监听 ⇒ 必须配置入站 Key，否则启动门禁拒绝启动。
      # 开发栈因此从「AUTH=false」改成「AUTH=true + 明确命名的 dev 占位密钥」。
      PRIVACY_AUTH_ENABLED: "true"
      PRIVACY_AUTH_INTERNAL_API_KEYS: "${PRIVSHIELD_ENGINE_API_KEY:-dev-engine-key}:dev-compose:*"
      # 限流在开发栈保持关闭（便于压测/联调打满）；生产编排默认 true。
      PRIVACY_RATE_LIMIT_ENABLED: "false"
      PRIVACY_LLM_PROVIDER: "${PRIVACY_LLM_PROVIDER:-vllm}"
      PRIVACY_LLM_API_BASE: "${LLM_API_BASE:-http://vllm:8000/v1}"
      PRIVACY_LLM_MODEL_NAME: "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      PRIVACY_LLM_API_KEY: "EMPTY"
    volumes:
      - ./privacy-profile.yaml:/etc/PrivShield/privacy-profile.yaml:ro
      - ../../rules:/app/rules:ro                # 挂载 YAML 分类规则
      - budget-db-dev:/data/budget
      - audit-logs-dev:/var/log/privacy
    networks:
      - backend
      - frontend
      - llm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8079/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"

  # 2. Console Go 后端代理
  console-backend-go:
    build:
      context: ../..
      dockerfile: console/engine-console/bff-go/Dockerfile
    image: privacy-console-backend-go:1.8.0-dev
    container_name: privacy-console-backend-go-dev
    ports:
      - "8081:8081"
    environment:
      BFF_HOST: "0.0.0.0"
      BFF_PORT: "8081"
      BFF_AGENT_GRPC_HOST: "PrivShield"
      BFF_AGENT_GRPC_PORT: "50051"
      BFF_AGENT_URL: "http://PrivShield:8079"
      # ── P0-1 零信任默认态（开发态密钥，可用 .env 覆盖）──
      BFF_API_KEY: "${BFF_API_KEY:-dev-console-key}"
      BFF_AGENT_API_KEY: "${PRIVSHIELD_ENGINE_API_KEY:-dev-engine-key}"
      BFF_HUB_URL: "http://service-hub:8082"
      BFF_HUB_API_KEY: "${SERVICE_HUB_API_KEY:-dev-service-hub-key}"
      BFF_DATASOURCE_URL: "http://datasource-mgr:8083"
      BFF_DATASOURCE_API_KEY: "${DATASOURCE_MGR_API_KEY:-dev-datasource-key}"
      BFF_AUDIT_URL: "http://audit-log:8084"
      BFF_AUDIT_API_KEY: "${AUDIT_LOG_API_KEY:-dev-audit-key}"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"

  # 3. Console 前端 Web UI (Nginx 托管)
  console-web:
    build:
      context: ../../console/engine-console/web
      dockerfile: Dockerfile
    image: privacy-console-web:1.8.0-dev
    container_name: privacy-console-web-dev
    ports:
      - "5173:5173"
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: "no"

  # ===========================================================================
  # 5. 数据服务调度中枢 (Service Hub) — 开发模式
  # ===========================================================================
  service-hub:
    build:
      context: ../..
      dockerfile: services/service-hub/Dockerfile
    container_name: privshield-service-hub-dev
    ports:
      - "8082:8082"
      - "50052:50052"
    environment:
      SERVICE_HUB_HOST: "0.0.0.0"
      SERVICE_HUB_PORT: "8082"
      SERVICE_HUB_GRPC_HOST: "0.0.0.0"
      SERVICE_HUB_GRPC_PORT: "50052"
      PRIVACY_AGENT_REST_HOST: "PrivShield"
      PRIVACY_REST_PORT: "8079"
      SERVICE_HUB_DB_PATH: "/app/data/service-hub.db"
      # ── P0-1 零信任默认态（开发态密钥，可用 .env 覆盖）──
      SERVICE_HUB_API_KEY: "${SERVICE_HUB_API_KEY:-dev-service-hub-key}"
      BFF_AGENT_API_KEY: "${PRIVSHIELD_ENGINE_API_KEY:-dev-engine-key}"
      SERVICE_HUB_DATASOURCE_API_KEY: "${DATASOURCE_MGR_API_KEY:-dev-datasource-key}"
      SERVICE_HUB_AUDIT_LOG_API_KEY: "${AUDIT_LOG_API_KEY:-dev-audit-key}"
      # P1-8：开发栈不注入 SERVICE_HUB_PG_DSN ⇒ 中枢走 SQLite 单副本并在启动日志显式告警。
    volumes:
      - service-hub-data-dev:/app/data
    depends_on:
      PrivShield:
        condition: service_healthy
      datasource-mgr:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 40s
    restart: "no"

  # ===========================================================================
  # 6. 数据源管理 (Datasource Manager) — 开发模式
  # ===========================================================================
  datasource-mgr:
    build:
      context: ../..
      dockerfile: console/mock-datasource/Dockerfile
    container_name: privshield-datasource-mgr-dev
    ports:
      - "8083:8083"
      - "50053:50053"
    environment:
      DATASOURCE_MGR_HOST: "0.0.0.0"
      DATASOURCE_MGR_PORT: "8083"
      DATASOURCE_MGR_GRPC_HOST: "0.0.0.0"
      DATASOURCE_MGR_GRPC_PORT: "50053"
      # 注：本服务**没有**数据库/存储类环境变量（原 DATASOURCE_MGR_DB_PATH 是从不被读取的幽灵变量，
      # 已按 P2-1 删除）；同时删除本服务不读取的 PRIVACY_AGENT_REST_HOST / PRIVACY_REST_PORT。
      # P0-1：0.0.0.0 监听 + 暴露原始样本记录 ⇒ 必须配置入站 Key。
      DATASOURCE_MGR_API_KEY: "${DATASOURCE_MGR_API_KEY:-dev-datasource-key}"
    volumes:
      - datasource-mgr-data-dev:/app/data
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 40s
    restart: "no"

  # ===========================================================================
  # 7. 脱敏审计日志 (Audit Log) — 开发模式
  # ===========================================================================
  audit-log:
    build:
      context: ../..
      dockerfile: services/audit-log/Dockerfile
    container_name: privshield-audit-log-dev
    ports:
      - "8084:8084"
      - "50054:50054"
    environment:
      AUDIT_LOG_HOST: "0.0.0.0"
      AUDIT_LOG_PORT: "8084"
      AUDIT_LOG_GRPC_HOST: "0.0.0.0"
      AUDIT_LOG_GRPC_PORT: "50054"
      PRIVACY_AGENT_REST_HOST: "PrivShield"
      PRIVACY_REST_PORT: "8079"
      AUDIT_LOG_DB_PATH: "/app/data/audit-log.db"
      # ── P0-1 启动门禁必填：入站 Key + P0-3 快照加密主密钥 + P1-2 哈希链 HMAC 密钥 ──
      AUDIT_LOG_API_KEY: "${AUDIT_LOG_API_KEY:-dev-audit-key}"
      AUDIT_LOG_ENCRYPTION_KEY: "${AUDIT_LOG_ENCRYPTION_KEY:-dev-audit-encryption-key-change-me}"
      AUDIT_LOG_HASH_KEY: "${AUDIT_LOG_HASH_KEY:-dev-audit-hash-key-change-me}"
      # P0-4：禁止静默降级到内存存储；P0-8：0 = 永不物理删除存证。
      AUDIT_LOG_STRICT_STORAGE: "true"
      AUDIT_LOG_RETENTION_DAYS: "0"
    volumes:
      - audit-log-data-dev:/app/data
    depends_on:
      PrivShield:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 40s
    restart: "no"

  # 8. vLLM 大模型推理服务 (Profile: llm)
  vllm:
    profiles: ["llm"]
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    container_name: PrivShield-vllm-dev
    command:
      - "--model"
      - "/models/Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      - "--served-model-name"
      - "Qwen3.5-0.8B-Privacy-Classifier-Smoother"
      - "--trust-remote-code"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--max-model-len"
      - "4096"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    volumes:
      - ../../.models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - llm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"

  # 9. Prometheus 监控 (Profile: monitoring)
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: PrivShield-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/rules/PrivShield-alerts.yml:ro
      - prometheus-data-dev:/prometheus
    networks:
      - backend
      - frontend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: "no"

  # 10. Grafana 可视化面板 (Profile: monitoring)
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    container_name: PrivShield-grafana-dev
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "true"
    volumes:
      - ../grafana:/etc/grafana/provisioning:ro
      - grafana-data-dev:/var/lib/grafana
    networks:
      - frontend
    depends_on:
      - prometheus
    restart: "no"

  # ===========================================================================
  # 11. 可选：Phase B PostgreSQL（多副本 service-hub 原子租约后端）
  #    PORT: 5432
  #    启用：docker compose -f docker-compose.dev.yml --profile phase-b up -d
  #    Phase B: PostgreSQL for multi-replica service-hub with atomic leases
  #    Enable: docker compose -f docker-compose.dev.yml --profile phase-b up -d
  # ===========================================================================
  phase-b-postgres:
    profiles: ["phase-b"]
    image: postgres:16-alpine
    container_name: privshield-phase-b-postgres-dev
    # P2-12：套用 synchronous_commit/full_page_writes/log_checkpoints 基线；`-c ssl=off` 仅因 dev 无证书。
    command: ["postgres", "-D", "/var/lib/postgresql/data/pgdata", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "ssl=off"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "privshield_hub"
      POSTGRES_USER: "${PG_USER:-privshield}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-privshield_dev}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - phase-b-pg-data-dev:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-privshield} -d privshield_hub"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "no"
