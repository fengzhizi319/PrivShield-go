# =============================================================================
# PrivShield - Go Engine Override for Docker Compose
# PrivShield - Go 原生引擎替代覆盖层
#
# 使用方式 / Usage:
#   docker compose -f docker-compose.yml -f docker-compose.go-engine.yml up -d
#
# 或通过脚本启动：
#   bash scripts/dev/docker-start-go-all.sh
#   bash scripts/dev/docker-start-bff-go-agent.sh
#
# 说明：
#   本文件覆盖主 docker-compose.yml 中的 PrivShield 服务定义，
#   将 Python 引擎镜像替换为 Go 原生引擎（engine-go/Dockerfile 构建）。
#   Go 引擎镜像极小（~15MB），启动速度快（<1s），无 Python/ML 依赖。
#
# 环境变量：
#   PRIVSHIELD_GO_IMAGE: Go 引擎镜像名（默认 privshield-go:1.0.0）
# =============================================================================

services:

  # 覆盖主文件中的 PrivShield 服务定义
  PrivShield:
    # 使用 Go 引擎镜像（通过环境变量可覆盖）
    image: ${PRIVSHIELD_GO_IMAGE:-privshield-go:1.0.0}
    # Go 引擎不需要本地构建（由启动脚本预先构建）
    build: null
    pull_policy: if_not_present
    container_name: PrivShield-Go
    environment:
      # Go 引擎环境变量
      PRIVACY_REST_HOST: "0.0.0.0"
      PRIVACY_REST_PORT: "8079"
      PRIVACY_GRPC_HOST: "0.0.0.0"
      PRIVACY_GRPC_PORT: "50051"
      PRIVACY_LOG_LEVEL: "${PRIVACY_LOG_LEVEL:-INFO}"
      # Go 引擎没有 PRIVACY_LOG_FORMAT / PRIVACY_PROFILE / PRIVACY_BUDGET_DB 读取点：
      # 日志固定 JSON（observability.InitLogger），参数面走 PRIVACY_CONFIG_FILE + PRIVACY_RULES_DIR，
      # 隐私预算为进程内无锁原子会计（PRIVACY_NAMESPACE 做租户隔离），故不声明主文件里的 Python 变量。
      # ── Layer-3 LLM（Go 引擎读取点与 Python 命名不同，必须在此覆盖，否则叠加本层后 Layer-3 永不启用）──
      #   Go:  PRIVACY_LLM_ENABLE / PRIVACY_LLM_ENDPOINT / PRIVACY_LLM_MODEL / PRIVACY_LLM_API_KEY
      #   Python: PRIVACY_LLM_PROVIDER / PRIVACY_LLM_API_BASE / PRIVACY_LLM_MODEL_NAME
      # 端点必须是完整 chat/completions URL；默认 false，需要 Layer-3 时显式置 PRIVACY_LLM_ENABLE=true。
      PRIVACY_LLM_ENABLE: "${PRIVACY_LLM_ENABLE:-false}"
      # 跨容器明文 HTTP：P0-5 默认拒绝非环回 http:// 端点，故必须显式声明容器内网豁免开关。
      PRIVACY_LLM_ENDPOINT: "${LLM_API_BASE:-http://vllm:8000/v1/chat/completions}"
      PRIVACY_LLM_ALLOW_INSECURE_HTTP_ENDPOINT: "${PRIVACY_LLM_ALLOW_INSECURE_HTTP_ENDPOINT:-false}"
      PRIVACY_LLM_MODEL: "${PRIVACY_LLM_MODEL:-Qwen3.5-0.8B-Privacy-Classifier-Smoother}"
    # Go 引擎不需要 Python 的 volumes 挂载
    volumes:
      - budget-db:/data/budget
    # Go 引擎启动极快，healthcheck 间隔可以缩短
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8079/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Go 引擎资源消耗远低于 Python 引擎
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    # Go 引擎 gRPC GracefulStop 更快
    stop_grace_period: 15s
