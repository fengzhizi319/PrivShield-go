apiVersion: apps/v1
kind: Deployment
metadata:
  name: privshield-agent
  namespace: default
  labels:
    app.kubernetes.io/name: privshield-agent
    app.kubernetes.io/component: privacy-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: privshield-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privshield-agent
    spec:
      containers:
        - name: agent
          image: privshield-agent:10.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8079
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: AGENT_REST_HOST
              value: "0.0.0.0"
            - name: AGENT_REST_PORT
              value: "8079"
            - name: AGENT_GRPC_HOST
              value: "0.0.0.0"
            - name: AGENT_GRPC_PORT
              value: "50051"
            - name: AGENT_RULES_DIR
              value: "/app/services/privacy-engine/rules/domains"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8079
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8079
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: privshield-agent
  namespace: default
  labels:
    app.kubernetes.io/name: privshield-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8079
      targetPort: 8079
    - name: grpc
      port: 50051
      targetPort: 50051
  selector:
    app.kubernetes.io/name: privshield-agent
