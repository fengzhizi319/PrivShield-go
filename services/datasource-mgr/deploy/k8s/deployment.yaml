apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasource-mgr
  labels:
    app.kubernetes.io/name: datasource-mgr
    app.kubernetes.io/component: datasource
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: datasource-mgr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datasource-mgr
        app.kubernetes.io/component: datasource
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: datasource-mgr
          image: privshield-datasource-mgr:1.8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
            - name: grpc
              containerPort: 50053
              protocol: TCP
          env:
            - name: DATASOURCE_MGR_HOST
              value: "0.0.0.0"
            - name: DATASOURCE_MGR_PORT
              value: "8083"
            - name: DATASOURCE_MGR_GRPC_HOST
              value: "0.0.0.0"
            - name: DATASOURCE_MGR_GRPC_PORT
              value: "50053"
            # 注：本服务不读取 PRIVACY_AGENT_REST_HOST / PRIVACY_REST_PORT（示范数据源为
            # samples/*.csv 真实同构模拟库，不调用引擎），也**没有**任何数据库变量
            #（原 DATASOURCE_MGR_DB_PATH 属 P2-1 幽灵变量，已删除）。
            # P0-1：0.0.0.0 监听 ⇒ 入站 Key 必填，缺失即启动门禁拒绝启动。
            # 部署前创建：kubectl create secret generic datasource-mgr-apikeys \
            #   --from-literal=api-key='<openssl rand -hex 16>'
            - name: DATASOURCE_MGR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datasource-mgr-apikeys
                  key: api-key
            - name: DATASOURCE_MGR_LOG_FORMAT
              value: "json"
            - name: DATASOURCE_MGR_LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: datasource-store
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: datasource-store
          persistentVolumeClaim:
            claimName: datasource-mgr-data
