site_name: PrivShield
site_description: Privacy primitives and data classification sidecar
repo_url: https://github.com/fengzhizi319/PrivShield-go
edit_uri: edit/main/docs/

theme:
  # Material 主题配合中英双语内容、代码块复制和编辑按钮，适合技术型文档站点。
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  # 这些扩展主要用于让架构/运维文档更易读：
  # - admonition/details 用于提示、警告和折叠说明
  # - superfences + mermaid 用于时序图、流程图和嵌套代码块
  # - tabbed / tasklist / toc / attr_list 用于更结构化的 API 与操作指南
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      # 使用 pymdownx slugify 保持中文字符与英文术语，与所有中文文档手写的
      # 目录锚点（如 #32-健康医疗信息-health-information）保持一致。
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - md_in_html

# MkDocs 1.6+ 链接验证策略：
# - 源码文件（engine/、services/、tests/ 等）不在 docs/ 内，但文档中需要引用；
#   将其设为 ignore 避免 strict 模式误报。
# - 锚点仍保留 warn，确保文档内部 TOC/交叉引用正确。
validation:
  omitted_files: ignore
  links:
    absolute_links: warn
    not_found: ignore
    unrecognized_links: ignore
  anchors: warn

plugins:
  # search：支持中英混合检索；minify：减少生成站点体积。
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

docs_dir: docs

