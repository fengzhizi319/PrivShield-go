site_name: PrivShield
site_description: Privacy primitives and data classification sidecar
repo_url: https://github.com/fengzhizi319/PrivShield-go
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - attr_list
  - md_in_html

validation:
  omitted_files: ignore
  links:
    absolute_links: warn
    not_found: ignore
    unrecognized_links: ignore
  anchors: warn

plugins:
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

docs_dir: docs

